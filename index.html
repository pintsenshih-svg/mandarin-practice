<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>來！學華語 — Práctica de conversación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #1C2333;
  --ink-soft: #3D4558;
  --vermillion: #D94F3D;
  --vermillion-pale: #FDF0EE;
  --jade: #3A9E8A;
  --jade-pale: #EBF7F5;
  --paper: #F5F2EC;
  --paper-dark: #EDE9E0;
  --mist: #E4E0D8;
  --gold: #C8933A;
  --gold-pale: #FDF5E6;
  --white: #FFFFFF;
  --muted: #7D7A74;
  --sidebar-w: 280px;
  --radius: 14px;
  --radius-sm: 8px;
}

body {
  font-family: 'Inter', sans-serif;
  background: var(--paper);
  color: var(--ink);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── TOPBAR ── */
.topbar {
  height: 56px;
  background: var(--ink);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 16px;
  flex-shrink: 0;
  z-index: 200;
}
.topbar-logo {
  font-family: 'Noto Serif TC', serif;
  color: var(--white);
  font-size: 19px;
  letter-spacing: 0.02em;
}
.topbar-logo span { color: var(--vermillion); }
.topbar-sub { color: #8A90A2; font-size: 12px; }
.topbar-spacer { flex: 1; }
.topbar-teacher-btn {
  background: none;
  border: 1px solid #3D4558;
  color: #8A90A2;
  border-radius: 20px;
  padding: 5px 14px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
}
.topbar-teacher-btn:hover { border-color: var(--gold); color: var(--gold); }
.menu-toggle {
  display: none;
  background: none; border: none;
  color: var(--white); font-size: 22px; cursor: pointer;
}

/* ── LAYOUT ── */
.app-body {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w);
  background: var(--white);
  border-right: 1px solid var(--mist);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
}
.sidebar-header {
  padding: 16px;
  border-bottom: 1px solid var(--mist);
}
.sidebar-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}
.search-input {
  width: 100%;
  border: 1.5px solid var(--mist);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  font-size: 13px;
  background: var(--paper);
  color: var(--ink);
  outline: none;
}
.search-input:focus { border-color: var(--vermillion); }
.lesson-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}
.lesson-list::-webkit-scrollbar { width: 4px; }
.lesson-list::-webkit-scrollbar-thumb { background: var(--mist); border-radius: 2px; }
.lesson-item {
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: background 0.12s;
  margin-bottom: 2px;
}
.lesson-item:hover { background: var(--paper); }
.lesson-item.active { background: var(--vermillion-pale); }
.lesson-num {
  width: 28px; height: 28px;
  border-radius: 6px;
  background: var(--paper-dark);
  color: var(--muted);
  font-size: 12px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.lesson-item.active .lesson-num { background: var(--vermillion); color: white; }
.lesson-item-text { flex: 1; min-width: 0; }
.lesson-item-zh {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 14px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.lesson-item-es { font-size: 11px; color: var(--muted); }
.sidebar-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--mist);
  font-size: 12px;
  color: var(--muted);
  text-align: center;
}

/* ── MAIN CHAT AREA ── */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* Mode tabs */
.mode-tabs {
  background: var(--white);
  border-bottom: 1px solid var(--mist);
  padding: 10px 20px;
  display: flex;
  gap: 10px;
  flex-shrink: 0;
  align-items: center;
}
.huayecai-name {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
}
.mode-active-pill {
  background: var(--ink);
  color: white;
  border-radius: 20px;
  padding: 4px 14px;
  font-size: 12px;
  font-weight: 600;
}
.lesson-badge {
  margin-left: auto;
  font-size: 12px;
  color: var(--muted);
  background: var(--paper);
  padding: 4px 10px;
  border-radius: 10px;
  border: 1px solid var(--mist);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 220px;
}
/* Meta-boxes rendered in chat */
.box-context {
  background: #EBF7F5;
  border-left: 3px solid var(--jade);
  border-radius: 0 8px 8px 0;
  padding: 9px 13px;
  font-size: 13px;
  color: #1A5C52;
  margin-top: 6px;
}
.box-context strong { color: var(--jade); }
.box-correction {
  background: var(--gold-pale);
  border-left: 3px solid var(--gold);
  border-radius: 0 8px 8px 0;
  padding: 9px 13px;
  font-size: 13px;
  color: #5C3D00;
  margin-top: 6px;
}
.box-correction strong { color: var(--gold); }
.box-help {
  background: #F0F4FF;
  border-left: 3px solid #5B7FD4;
  border-radius: 0 8px 8px 0;
  padding: 9px 13px;
  font-size: 13px;
  color: #1A2A5C;
  margin-top: 6px;
}
.box-help strong { color: #5B7FD4; }
.transition-card {
  background: var(--jade-pale);
  border: 1px solid #A8DFDA;
  border-radius: var(--radius-sm);
  padding: 12px 16px;
  font-size: 13px;
  color: #1A5C52;
  margin-top: 6px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.transition-card .t-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.transition-card .t-btn {
  background: var(--jade);
  color: white;
  border: none;
  border-radius: 16px;
  padding: 5px 14px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
}
.transition-card .t-btn:hover { opacity: 0.85; }

/* Messages */
.messages {
  flex: 1;
  overflow-y: auto;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.messages::-webkit-scrollbar { width: 5px; }
.messages::-webkit-scrollbar-thumb { background: var(--mist); border-radius: 3px; }

.msg-row { display: flex; gap: 10px; max-width: 72%; }
.msg-row.ai { align-self: flex-start; }
.msg-row.user { align-self: flex-end; flex-direction: row-reverse; }

.msg-avatar {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0;
  background: var(--paper-dark);
}
.msg-row.user .msg-avatar { background: var(--ink); color: white; font-size: 14px; }

.msg-body { display: flex; flex-direction: column; gap: 3px; }

.bubble {
  border-radius: 16px 16px 16px 4px;
  padding: 12px 16px;
  background: var(--white);
  border: 1px solid var(--mist);
  line-height: 1.65;
}
.msg-row.user .bubble {
  background: var(--ink);
  color: white;
  border-color: var(--ink);
  border-radius: 16px 16px 4px 16px;
}
.bubble-zh {
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 17px;
  color: var(--ink);
}
.msg-row.user .bubble-zh { color: white; }
.bubble-py {
  font-size: 12px;
  color: var(--vermillion);
  margin-top: 3px;
  font-style: italic;
}
.bubble-es {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px;
}
.msg-row.user .bubble-py,
.msg-row.user .bubble-es { color: rgba(255,255,255,0.6); }

.feedback-card {
  background: var(--gold-pale);
  border: 1px solid #E8D5AA;
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  font-size: 13px;
  color: #6B4C0A;
  margin-top: 4px;
}
.feedback-card strong { color: var(--gold); }
.feedback-card .correct { color: var(--jade); font-weight: 600; font-family: 'Noto Sans TC', sans-serif; }

.praise-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--jade-pale);
  color: var(--jade);
  border-radius: 12px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 600;
  margin-top: 4px;
}

/* Typing indicator */
.typing-row { align-self: flex-start; display: flex; gap: 10px; align-items: center; }
.typing-bubble {
  background: var(--white);
  border: 1px solid var(--mist);
  border-radius: 16px;
  padding: 12px 18px;
  display: flex; gap: 5px; align-items: center;
}
.typing-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--muted);
  animation: typingBounce 1.3s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
  30% { transform: translateY(-7px); opacity: 1; }
}

/* Welcome / empty state */
.welcome-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 40px;
  text-align: center;
}
.welcome-icon { font-size: 52px; }
.welcome-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 22px;
  color: var(--ink);
}
.welcome-sub { font-size: 14px; color: var(--muted); line-height: 1.7; max-width: 340px; }

/* ── INPUT AREA ── */
.input-area {
  background: var(--white);
  border-top: 1px solid var(--mist);
  padding: 12px 16px 14px;
  flex-shrink: 0;
}
.quick-chips {
  display: flex;
  gap: 7px;
  overflow-x: auto;
  margin-bottom: 10px;
  padding-bottom: 2px;
}
.quick-chips::-webkit-scrollbar { display: none; }
.chip {
  background: var(--paper);
  border: 1px solid var(--mist);
  border-radius: 16px;
  padding: 5px 12px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  font-family: 'Noto Sans TC', sans-serif;
  color: var(--ink);
  transition: background 0.1s, border-color 0.1s;
}
.chip:hover { background: var(--vermillion-pale); border-color: var(--vermillion); }

.input-row { display: flex; gap: 10px; align-items: flex-end; }
.text-input {
  flex: 1;
  border: 1.5px solid var(--mist);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 15px;
  font-family: 'Noto Sans TC', sans-serif;
  color: var(--ink);
  background: var(--paper);
  outline: none;
  resize: none;
  max-height: 100px;
  line-height: 1.5;
  transition: border-color 0.15s;
}
.text-input:focus { border-color: var(--vermillion); background: white; }
.text-input::placeholder { color: var(--muted); font-family: Inter, sans-serif; font-size: 14px; }

.btn-group { display: flex; gap: 8px; align-items: flex-end; }

/* Voice button — the signature ink-drop element */
.voice-btn {
  width: 44px; height: 44px;
  border-radius: 50%;
  border: none;
  background: var(--paper-dark);
  color: var(--muted);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  position: relative;
  transition: all 0.2s;
  flex-shrink: 0;
}
.voice-btn:hover { background: var(--paper); color: var(--ink); }
.voice-btn.recording {
  background: var(--vermillion);
  color: white;
  animation: inkPulse 1.2s ease-out infinite;
}
@keyframes inkPulse {
  0% { box-shadow: 0 0 0 0 rgba(217, 79, 61, 0.5); }
  70% { box-shadow: 0 0 0 14px rgba(217, 79, 61, 0); }
  100% { box-shadow: 0 0 0 0 rgba(217, 79, 61, 0); }
}
.voice-btn svg { pointer-events: none; }

.send-btn {
  width: 44px; height: 44px;
  border-radius: 12px;
  border: none;
  background: var(--ink);
  color: white;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
  flex-shrink: 0;
}
.send-btn:hover { background: var(--ink-soft); }
.send-btn:disabled { background: var(--mist); cursor: not-allowed; }

.voice-status {
  font-size: 12px;
  color: var(--vermillion);
  text-align: center;
  height: 16px;
  margin-top: 6px;
}

/* Hint button */
.hint-btn {
  background: none;
  border: 1px solid var(--mist);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
}
.hint-btn:hover { border-color: var(--jade); color: var(--jade); }

/* ── TEACHER MODAL ── */
.modal-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(28, 35, 51, 0.6);
  backdrop-filter: blur(4px);
  z-index: 500;
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--white);
  border-radius: var(--radius);
  width: 90%;
  max-width: 580px;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 24px 60px rgba(0,0,0,0.2);
}
.modal-header {
  padding: 22px 24px 16px;
  border-bottom: 1px solid var(--mist);
  display: flex;
  align-items: center;
  gap: 12px;
}
.modal-header h2 {
  font-size: 17px; font-weight: 600; flex: 1;
}
.modal-close {
  background: none; border: none;
  font-size: 20px; color: var(--muted); cursor: pointer;
  width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
  border-radius: 6px; transition: background 0.1s;
}
.modal-close:hover { background: var(--paper); }

.modal-body { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 18px; }

/* Auth gate */
.auth-gate { display: flex; flex-direction: column; gap: 14px; }
.auth-gate h3 { font-size: 15px; color: var(--ink); }
.auth-gate p { font-size: 13px; color: var(--muted); }
.field-label { font-size: 13px; font-weight: 500; color: var(--ink); margin-bottom: 6px; }
.field-input {
  width: 100%;
  border: 1.5px solid var(--mist);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
  transition: border-color 0.15s;
  color: var(--ink);
}
.field-input:focus { border-color: var(--gold); }
.btn-primary {
  background: var(--ink);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  padding: 11px 22px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.btn-primary:hover { background: var(--ink-soft); }
.btn-gold {
  background: var(--gold);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
}
.btn-gold:hover { opacity: 0.88; }
.btn-danger {
  background: var(--vermillion);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  padding: 7px 14px;
  font-size: 12px;
  cursor: pointer;
}
.btn-sm {
  background: var(--paper);
  border: 1px solid var(--mist);
  border-radius: 6px;
  padding: 5px 12px;
  font-size: 12px;
  cursor: pointer;
  color: var(--ink);
}
.btn-sm:hover { border-color: var(--ink-soft); }

.error-msg { font-size: 13px; color: var(--vermillion); }
.success-msg { font-size: 13px; color: var(--jade); }

/* Teacher admin */
.admin-panel { display: flex; flex-direction: column; gap: 20px; }
.admin-section {
  border: 1px solid var(--mist);
  border-radius: var(--radius-sm);
  overflow: hidden;
}
.admin-section-header {
  background: var(--paper);
  padding: 12px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  border-bottom: 1px solid var(--mist);
  display: flex;
  align-items: center;
  gap: 8px;
}
.admin-section-body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }

.lesson-admin-list { display: flex; flex-direction: column; gap: 6px; max-height: 220px; overflow-y: auto; }
.lesson-admin-item {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  background: var(--paper);
  font-size: 13px;
}
.lesson-admin-item .lesson-admin-zh { font-family: 'Noto Sans TC', sans-serif; font-weight: 500; flex: 1; }
.lesson-admin-item .lesson-admin-num {
  background: var(--vermillion);
  color: white;
  border-radius: 4px;
  padding: 2px 6px;
  font-size: 11px;
  font-weight: 600;
}

.upload-zone {
  border: 2px dashed var(--mist);
  border-radius: var(--radius-sm);
  padding: 28px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
  color: var(--muted);
  font-size: 13px;
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: var(--gold);
  background: var(--gold-pale);
  color: var(--gold);
}
.upload-zone input { display: none; }
.upload-icon { font-size: 30px; margin-bottom: 8px; }

.new-lesson-form { display: flex; flex-direction: column; gap: 12px; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
textarea.field-input { min-height: 80px; resize: vertical; font-family: 'Noto Sans TC', Inter, sans-serif; font-size: 13px; }

.tag { display: inline-flex; align-items: center; gap: 5px; background: var(--jade-pale); color: var(--jade); border-radius: 10px; padding: 2px 8px; font-size: 11px; }

/* Loading spinner */
.spinner {
  width: 16px; height: 16px;
  border: 2px solid var(--mist);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: white;
  padding: 10px 22px;
  border-radius: 24px;
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.3s, transform 0.3s;
  pointer-events: none;
  z-index: 1000;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Mobile */
@media (max-width: 680px) {
  .sidebar {
    position: fixed;
    top: 56px; left: 0; bottom: 0;
    z-index: 300;
    transform: translateX(-100%);
    transition: transform 0.25s;
    box-shadow: 4px 0 20px rgba(0,0,0,0.15);
  }
  .sidebar.open { transform: translateX(0); }
  .menu-toggle { display: flex; }
  .lesson-badge { display: none; }
  .mode-tab { padding: 6px 10px; font-size: 12px; }
  .msg-row { max-width: 88%; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Menú">☰</button>
  <div>
    <div class="topbar-logo">來<span>！</span>學華語</div>
    <div class="topbar-sub">Vamos a aprender mandarín</div>
  </div>
  <div class="topbar-spacer"></div>
  <button class="topbar-teacher-btn" onclick="openTeacherModal()">🔒 Profesor</button>
</div>

<!-- APP BODY -->
<div class="app-body">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Lecciones</div>
      <input type="text" class="search-input" id="lesson-search"
        placeholder="Buscar lección..." oninput="filterLessons(this.value)">
    </div>
    <div class="lesson-list" id="lesson-list"></div>
    <div class="sidebar-footer" id="sidebar-footer">9 lecciones disponibles</div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <!-- Mode bar -->
    <div class="mode-tabs">
      <div class="huayecai-name">🥦 花椰菜</div>
      <div class="mode-active-pill" id="mode-active-pill" style="display:none"></div>
      <div class="lesson-badge" id="lesson-badge">← Elige una lección</div>
    </div>

    <!-- Messages area OR welcome state -->

let state = {

  currentLessonId: null,
  currentMode: 'scenario',

  isTyping: false,
  isRecording: false,
  recognition: null,

function loadLessons() {
  try {
    const saved = localStorage.getItem('mandarin_lessons');
    state.lessons = saved ? JSON.parse(saved) : [...DEFAULT_LESSONS];
  } catch(e) {
    state.lessons = [...DEFAULT_LESSONS];
  }
  saveLessons();
}
function saveLessons() {
  localStorage.setItem('mandarin_lessons', JSON.stringify(state.lessons));
}
function getCurrentLesson() {
  return state.lessons.find(l => l.id === state.currentLessonId);
}

// ═══════════════════════════════════════
// SIDEBAR
// ═══════════════════════════════════════
function renderSidebar(filter = '') {
  const list = document.getElementById('lesson-list');
  const footer = document.getElementById('sidebar-footer');
  const filtered = state.lessons.filter(l =>
    l.zh.includes(filter) || l.es.toLowerCase().includes(filter.toLowerCase()) ||
    l.topic.toLowerCase().includes(filter.toLowerCase()) ||
    String(l.id).includes(filter)
  );
  list.innerHTML = filtered.map(l => `
    <div class="lesson-item ${l.id === state.currentLessonId ? 'active' : ''}"
         onclick="selectLesson(${l.id})">
      <div class="lesson-num">${l.id}</div>
      <div class="lesson-item-text">
        <div class="lesson-item-zh">${l.zh}</div>
        <div class="lesson-item-es">${l.es}</div>
      </div>
    </div>
  `).join('');
  footer.textContent = `${state.lessons.length} lecciones disponibles`;
}
function filterLessons(v) { renderSidebar(v); }
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}
function closeSidebarMobile() {
  if (window.innerWidth <= 680) document.getElementById('sidebar').classList.remove('open');
}

function selectLesson(id) {
  state.currentLessonId = id;
  state.currentMode = null;
  state.history = [];
  state.exchangeCount = 0;
  renderSidebar();

  const L = getCurrentLesson();

  document.getElementById('welcome-state').style.display = 'none';
  document.getElementById('messages').style.display = 'flex';
  document.getElementById('input-area').style.display = 'block';
  renderQuickChips([]);

  const pill = document.getElementById('mode-active-pill');

  // Show 花椰菜 greeting + mode selector
  document.getElementById('messages').innerHTML = '';
  appendHuayecaiGreeting(L);
}

function chooseMode(mode) {

function switchMode(mode) {
  state.currentMode = mode;
  const labels = { 'A':'🤖 Modo A', 'B':'🎭 Modo B', 'C':'🙋 Modo C' };
  const pill = document.getElementById('mode-active-pill');
  if (pill) {
    pill.textContent = labels[mode] || mode;
    pill.style.display = 'block';
  }
  if (state.currentLessonId) {
    state.history = [];
    document.getElementById('messages').innerHTML = '';
    startConversation();

function getCumulativeVocab(targetLesson) {
  const seen = new Set();
  const vocab = [];
  for (const lesson of state.lessons.filter(l => l.id <= targetLesson.id).sort((a,b) => a.id-b.id)) {
    for (const v of (lesson.vocab || [])) {
      if (!seen.has(v.zh)) { seen.add(v.zh); vocab.push({ ...v, fromLesson: lesson.id }); }
    }
  }
  return vocab;
}

function buildSystemPrompt(L) {
  const mode = state.currentMode;
  const cumVocab = getCumulativeVocab(L);

  const vocabByLesson = {};
  for (const v of cumVocab) {
    if (!vocabByLesson[v.fromLesson]) vocabByLesson[v.fromLesson] = [];
    vocabByLesson[v.fromLesson].push(`${v.zh}(${v.py})=${v.es}`);
  }
  const vocabBlock = Object.entries(vocabByLesson)
    .map(([lid, words]) => `  第${lid}課: ${words.join(' · ')}`)
    .join('\n');

  const currentVocabStr = L.vocab.map(v => v.zh).join('、');
  const alwaysStr = ALWAYS_ALLOWED.join('、');

  const modeInstr = {
    'A': `MODE A — IA pregunta, estudiante responde:
Haz UNA pregunta corta en mandarín sobre el tema "${L.topic}" usando el vocabulario permitido.
Evalúa la respuesta del estudiante. Si hay error gramatical, añade 🛠️ Sugerencia box.
Si es correcta, añade ✓ ¡Muy bien! y haz la siguiente pregunta.
Varía entre preguntas de 嗎 y pronombres interrogativos (什麼、哪、誰、幾).

async function startConversation() {
  const L = getCurrentLesson();
  if (!L) return;
  state.exchangeCount = 0;
  const sys = buildSystemPrompt(L);
  setTyping(true);

  const modeNote = {
    'A': '🤖 Modo A — IA pregunta, tú respondes',
    'B': '🎭 Modo B — Conversación del tema',
    'C': '🙋 Modo C — Tú preguntas, IA responde',
  };
  addSystemNote(modeNote[state.currentMode] || '');

  const openingPrompt = {
    'A': `Empieza el Modo A ahora. Haz tu primera pregunta al estudiante sobre el tema "${L.topic}".`,
    'B': `Empieza el Modo B ahora. Inicia la situación directamente con una frase corta en chino. Recuerda añadir el 🌍 Contexto box al final.`,
    'C': `Empieza el Modo C ahora. Saluda brevemente al estudiante en chino e invítale a hacerte preguntas sobre "${L.topic}".`,
  };

  const reply = await callClaude(sys, openingPrompt[state.currentMode] || openingPrompt['A'], true);
  setTyping(false);
  appendAIMessage(reply);
}

async function sendMessage() {
  const input = document.getElementById('text-input');
  const text = input.value.trim();
  if (!text || state.isTyping) return;
  input.value = '';
  input.style.height = 'auto';
  const L = getCurrentLesson();
  if (!L) return;

  appendUserMessage(text);
  state.exchangeCount = (state.exchangeCount || 0) + 1;

  const sys = buildSystemPrompt(L);
  setTyping(true);
  const reply = await callClaude(sys, text, false);
  setTyping(false);
  appendAIMessage(reply);
}

async function requestHint() {
  const L = getCurrentLesson();
  if (!L || state.isTyping) return;
  const sys = buildSystemPrompt(L);
  setTyping(true);
  const reply = await callClaude(sys, '💡 El estudiante pide ayuda. Activa el Help Box: muestra la traducción al español de tu último mensaje, y ofrece una frase de ejemplo que pueda usar.', false);
  setTyping(false);
  appendAIMessage(reply, true);
}

// ═══════════════════════════════════════
// CLAUDE API
// ═══════════════════════════════════════
async function callClaude(systemPrompt, userMessage, isOpening = false) {
  if (!isOpening) {
    state.history.push({ role: 'user', content: userMessage });
  }
  const messages = isOpening
    ? [{ role: 'user', content: userMessage }]
    : state.history;

  const apiKey = localStorage.getItem('mandarin_api_key');
  if (!apiKey) {
    openTeacherModal();
    return '⚠️ Falta la API key. Introdúcela en el panel del profesor (botón 🔒 arriba a la derecha).';
  }

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        system: systemPrompt,
        messages,
      }),
    });
    const data = await res.json();
    if (data.error) return `Error: ${data.error.message}`;
    const text = data.content?.map(b => b.text || '').join('') || 'Error al conectar.';
    if (isOpening) {
      state.history = [
        { role: 'user', content: userMessage },
        { role: 'assistant', content: text },
      ];
    } else {
      state.history.push({ role: 'assistant', content: text });
    }
    return text;
  } catch(e) {
    return 'Error de conexión. Por favor intenta de nuevo.';
  }
}

// ═══════════════════════════════════════
// MESSAGE RENDERING
// ═══════════════════════════════════════

function parseAIText(raw) {
  // Split on transition block
  let mainRaw = raw, transitionText = null;
  const transMatch = raw.match(/---TRANSITION---([\s\S]*?)---END_TRANSITION---/);
  if (transMatch) {
    transitionText = transMatch[1].trim();
    mainRaw = raw.replace(/---TRANSITION---[\s\S]*?---END_TRANSITION---/, '').trim();
  }

  // Extract meta-boxes
  let contextBox = '', helpBox = '', correctionBox = '', praise = false;
  mainRaw = mainRaw.replace(/🌍\s*Contexto:\s*([^\n🛠💡]*)/g, (_, c) => { contextBox = c.trim(); return ''; });
  mainRaw = mainRaw.replace(/💡\s*Traducción:\s*([^\n🛠🌍]*)/g, (_, c) => { helpBox = c.trim(); return ''; });
  mainRaw = mainRaw.replace(/🛠️?\s*Sugerencia:\s*([^\n🌍💡]*)/g, (_, c) => { correctionBox = c.trim(); return ''; });
  if (mainRaw.includes('✓') || mainRaw.includes('¡Muy bien')) { praise = true; }
  mainRaw = mainRaw.replace(/✓.*¡Muy bien[^\n]*/g, '').trim();

  // Parse main Chinese + pinyin lines
  const lines = mainRaw.split('\n').map(l => l.trim()).filter(Boolean);
  const dialogueLines = [];
  for (const line of lines) {
    if (line.match(/[\u4e00-\u9fff]/) || (line.startsWith('(') && line.endsWith(')'))) {
      dialogueLines.push(line);
    }
  }

  return { dialogueLines, contextBox, helpBox, correctionBox, praise, transitionText };
}

function renderDialogueLines(lines) {
  let html = '';
  for (const line of lines) {
    if (line.startsWith('(') && line.endsWith(')')) {
      html += `<div class="bubble-py">${line.slice(1,-1)}</div>`;
    } else {
      html += `<div class="bubble-zh">${line}</div>`;
    }
  }
  return html;
}

function appendAIMessage(raw, isHint = false) {
  const parsed = parseAIText(raw);
  const msgs = document.getElementById('messages');

  const row = document.createElement('div');
  row.className = 'msg-row ai';

  const mainContent = parsed.dialogueLines.length
    ? renderDialogueLines(parsed.dialogueLines)
    : `<div class="bubble-zh" style="font-size:14px">${raw.replace(/\n/g,'<br>')}</div>`;

  row.innerHTML = `
    <div class="msg-avatar">${isHint ? '💡' : '🥦'}</div>
    <div class="msg-body">
      <div class="bubble">${mainContent}</div>
      ${parsed.praise ? `<div class="praise-badge">✓ ¡Muy bien!</div>` : ''}
      ${parsed.contextBox ? `<div class="box-context"><strong>🌍 Contexto:</strong> ${parsed.contextBox}</div>` : ''}
      ${parsed.helpBox ? `<div class="box-help"><strong>💡 Traducción:</strong> ${parsed.helpBox}</div>` : ''}
      ${parsed.correctionBox ? `<div class="box-correction"><strong>🛠️ Sugerencia:</strong> ${parsed.correctionBox}</div>` : ''}
      ${parsed.transitionText ? renderTransitionCard(parsed.transitionText) : ''}
    </div>
  `;
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
}

function renderTransitionCard(text) {
  const L = getCurrentLesson();
  return `<div class="transition-card">
    <div>${text.split('\n')[0]}</div>
    <div class="t-btns">
      <button class="t-btn" onclick="chooseMode('A')">🤖 Modo A</button>
      <button class="t-btn" onclick="chooseMode('B')">🎭 Modo B</button>

      <button class="t-btn" style="background:var(--muted)" onclick="appendHuayecaiGreeting(getCurrentLesson())">🔄 Cambiar lección</button>
    </div>

}

function appendUserMessage(text) {
  const msgs = document.getElementById('messages');
  const row = document.createElement('div');
  row.className = 'msg-row user';
  row.innerHTML = `
    <div class="msg-avatar">👤</div>

function addSystemNote(text) {

function setTyping(on) {
  state.isTyping = on;
  document.getElementById('send-btn').disabled = on;

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// VOICE INPUT
// ═══════════════════════════════════════
function setupVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('voice-btn').title = 'Tu navegador no soporta reconocimiento de voz';
    document.getElementById('voice-btn').style.opacity = '0.4';
    return;
  }
  state.recognition = new SpeechRecognition();
  state.recognition.lang = 'zh-TW';
  state.recognition.continuous = false;
  state.recognition.interimResults = true;

  state.recognition.onstart = () => {
    state.isRecording = true;
    document.getElementById('voice-btn').classList.add('recording');
    document.getElementById('voice-status').textContent = '🔴 Escuchando... habla ahora';
  };
  state.recognition.onresult = (e) => {
    const transcript = Array.from(e.results).map(r => r[0].transcript).join('');
    document.getElementById('text-input').value = transcript;
    autoResize(document.getElementById('text-input'));
    if (e.results[e.results.length - 1].isFinal) {
      document.getElementById('voice-status').textContent = '✓ Capturado: ' + transcript;
    }
  };
  state.recognition.onerror = (e) => {
    document.getElementById('voice-status').textContent = 'Error: ' + e.error;
    stopVoice();
  };
  state.recognition.onend = () => stopVoice();
}

function toggleVoice() {
  if (!state.recognition) return;
  if (state.isRecording) {
    state.recognition.stop();
  } else {
    try { state.recognition.start(); }
    catch(e) { showToast('Activa el micrófono en tu navegador'); }
  }
}
function stopVoice() {
  state.isRecording = false;
  document.getElementById('voice-btn').classList.remove('recording');
  setTimeout(() => { document.getElementById('voice-status').textContent = ''; }, 3000);
}

  if (file && file.type === 'application/pdf') handlePDFUpload(file);
}

async function handlePDFUpload(file) {
  if (!file) return;
  const status = document.getElementById('upload-status');
  status.innerHTML = `<div style="font-size:13px;color:var(--muted);margin-top:8px"><span class="spinner"></span> Procesando PDF con AI... esto puede tardar 30s</div>`;

  try {
    const base64 = await fileToBase64(file);
    const nextId = Math.max(...state.lessons.map(l => l.id)) + 1;

    const apiKey = localStorage.getItem('mandarin_api_key') || '';
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 1000,
        messages: [{
          role: 'user',
          content: [
            { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: base64 } },
            { type: 'text', text: `Analiza este documento de lección de mandarín taiwanés y responde SOLO con JSON válido (sin backticks, sin preamble):
{
  "zh": "título en chino tradicional",
  "es": "título en español",
  "topic": "tema en español (2-4 palabras)",
  "objectives": "objetivos de aprendizaje separados por · ",
  "vocab": [{"zh":"字","py":"pīnyīn","es":"español"}, ...],
  "scenarios": ["situación 1", "situación 2"],
  "grammarFocus": "puntos gramaticales clave",
  "quickReplies": ["frase1en中文", "frase2"]
}
Extrae máximo 12 palabras de vocabulario clave. Caracteres tradicionales siempre.` }
          ]
        }]
      })
    });

    const data = await res.json();
    const raw = data.content?.map(b => b.text || '').join('') || '';
    const clean = raw.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);
    parsed.id = nextId;

    state.lessons.push(parsed);
    saveLessons();
    renderSidebar();
    status.innerHTML = `<div class="success-msg" style="margin-top:8px">✓ Lección "${parsed.zh}" añadida como lección ${nextId}.</div>`;
    showToast(`✓ Nueva lección añadida: ${parsed.zh}`);
  } catch(e) {
    status.innerHTML = `<div class="error-msg" style="margin-top:8px">Error al procesar el PDF. Intenta añadirla manualmente.</div>`;
  }
}

function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function exportHTML() {
  const lessonsJSON = JSON.stringify(state.lessons);

  // Fetch the original HTML source as text (works both locally and on CodePen)
  const source = document.documentElement.outerHTML;

  // Strategy: inject lessons as a script tag right before </body>
  // Remove any previously injected export tag first
  let cleaned = source.replace(/<!--EXPORT_DATA-->[\s\S]*?<!--\/EXPORT_DATA-->/g, '');

  // Inject current lessons right before </body>
  const injection = `<!--EXPORT_DATA--><script>
(function(){
  var exported = ${lessonsJSON};
  var orig = window.loadLessons;
  window.loadLessons = function(){
    try {
      var saved = localStorage.getItem('mandarin_lessons');
      if (!saved) {
        state.lessons = exported;
        saveLessons();
      } else {
        state.lessons = JSON.parse(saved);
      }
    } catch(e) {
      state.lessons = exported;
    }
  };
})();
<\/script><!--/EXPORT_DATA-->`;

  const finalHTML = cleaned.replace('</body>', injection + '</body>');

  const blob = new Blob([finalHTML], { type: 'text/html;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '來學華語_對話練習_' + new Date().toISOString().slice(0,10) + '.html';
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 下載完成！把這個新版本貼到 CodePen 就會包含你的修改。');
}

Palabras: ${chars.join(', ')}

Formato exacto:
[
  {"zh": "你好", "py": "nǐhǎo", "es": "hola"},
  {"zh": "謝謝", "py": "xièxiè", "es": "gracias"}
]

Usa caracteres tradicionales. Pīnyīn con todos los tonos marcados.`

function saveLessonEdit(id) {
  const zh = document.getElementById('edit-zh').value.trim();
  const es = document.getElementById('edit-es').value.trim();
  const topic = document.getElementById('edit-topic').value.trim();
  const grammar = document.getElementById('edit-grammar').value.trim();
  const obj = document.getElementById('edit-obj').value.trim();
  const scenariosRaw = document.getElementById('edit-scenarios').value.trim();
  const quickRaw = document.getElementById('edit-quick').value.trim();
  const msgEl = document.getElementById('edit-msg');

  if (!zh || !es) {
    msgEl.innerHTML = `<div class="error-msg">Por favor rellena al menos el título en chino y en español.</div>`;
    return;
  }

  // Use AI-generated vocab if available, otherwise keep existing
  let vocab = window._pendingVocab || null;
  if (!vocab || vocab.length === 0) {
    // Keep existing vocab from the lesson
    const existing = state.lessons.find(l => l.id === id);
    vocab = existing ? existing.vocab : [];
    if (vocab.length === 0) {
      msgEl.innerHTML = `<div class="error-msg">⚠️ Genera el vocabulario con AI primero, o añade palabras.</div>`;
      return;
    }
  }

  const scenarios = scenariosRaw.split('\n').map(l => l.trim()).filter(Boolean);
  const quickReplies = quickRaw.split('\n').map(l => l.trim()).filter(Boolean).slice(0, 4);

  const idx = state.lessons.findIndex(l => l.id === id);
  if (idx === -1) return;
  state.lessons[idx] = {
    ...state.lessons[idx],
    zh, es, topic, grammarFocus: grammar, objectives: obj,
    vocab, scenarios,
    quickReplies: quickReplies.length ? quickReplies : vocab.slice(0,4).map(v => v.zh),
  };

  saveLessons();
  renderSidebar();
  window._pendingVocab = null;

  msgEl.innerHTML = `<div class="success-msg">✅ Lección ${id} guardada. (${vocab.length} palabras)</div>`;

  if (state.currentLessonId === id) {
    document.getElementById('lesson-badge').textContent = `第${id}課 · ${zh} · ${topic}`;
    renderQuickChips(state.lessons[idx].quickReplies);
  }
}
